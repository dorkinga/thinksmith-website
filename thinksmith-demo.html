<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThinkSmith — how it works</title>
<style>
  :root{
    --font-sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    --ink:#1f2430; --sec:#5b6270; --muted:#9aa2ad;
    --border:#e6e7ec; --border-strong:#d3d5dc;
    --paper:#ffffff; --shell:#faf8fd;
    --purple:#8C2DDF; --purple-deep:#3C2A6B; --purple-wash:#F8F1FC; --purple-soft:#D9C4F2;
    --grow:#7cb342; --grow-deep:#5f9b28; --band-bg:#edf6e0; --band-text:#4f7a1f;
    --track:#eef0f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--shell);font-family:var(--font-sans);color:var(--ink);
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px;
  }

  .demo{width:100%;max-width:1080px}

  /* ── Masthead ─────────────────────────────────────────────── */
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
  .wordmark{font-size:15px;font-weight:600;letter-spacing:-0.01em}
  .wordmark span{color:var(--purple)}
  .kicker{font-size:11px;color:var(--muted);letter-spacing:0.09em;text-transform:uppercase}

  /* ── Frame ────────────────────────────────────────────────── */
  .frame{
    display:grid;grid-template-columns:260px 1fr;gap:0;
    background:var(--paper);border:0.5px solid var(--border);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(31,36,48,.04),0 12px 40px rgba(60,42,107,.07);
  }

  /* ── Left rail ────────────────────────────────────────────── */
  .rail{background:var(--purple-wash);border-right:0.5px solid var(--border);padding:20px 18px;display:flex;flex-direction:column}
  .step{display:flex;gap:11px;align-items:flex-start;padding:9px 8px;border-radius:8px;cursor:pointer;transition:background .2s}
  .step:hover{background:rgba(140,45,223,.06)}
  .step:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
  .num{
    flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
    font-size:10.5px;font-weight:700;background:#fff;color:var(--muted);
    border:0.5px solid var(--border-strong);transition:all .25s;margin-top:1px;
  }
  .slabel{font-size:12.5px;line-height:1.35;color:var(--sec);transition:color .25s}
  .step.done .num{background:var(--band-bg);color:var(--band-text);border-color:transparent}
  .step.now  .num{background:var(--purple);color:#fff;border-color:transparent}
  .step.now  .slabel{color:var(--ink);font-weight:600}

  /* Signature: the child's thinking, growing as the demo runs. */
  .growth{margin-top:auto;padding-top:18px;border-top:0.5px solid var(--border)}
  .growth h4{margin:0 0 3px;font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .growth .sub{font-size:10.5px;color:var(--muted);margin-bottom:10px}
  .comp{margin-bottom:8px}
  .comp .cn{font-size:10.5px;color:var(--sec);margin-bottom:3px;display:flex;justify-content:space-between}
  .comp .cn b{color:var(--band-text);font-weight:600;font-variant-numeric:tabular-nums}
  .bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--grow);transition:width 1.1s cubic-bezier(.22,.9,.3,1)}

  /* ── Stage ────────────────────────────────────────────────── */
  .stage{padding:26px 30px 22px;min-height:452px;display:flex;flex-direction:column}
  .eyebrow{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--purple);font-weight:600;margin-bottom:7px}
  .stage h2{margin:0 0 16px;font-size:25px;font-weight:400;letter-spacing:-0.022em;line-height:1.2;max-width:22ch}

  .screen{flex:1;background:var(--shell);border:0.5px solid var(--border);border-radius:10px;padding:16px 17px;position:relative;overflow:hidden}
  .fade{opacity:0;transform:translateY(7px);animation:rise .5s cubic-bezier(.22,.9,.3,1) forwards}
  .fade.d1{animation-delay:.10s}.fade.d2{animation-delay:.22s}
  .fade.d3{animation-delay:.34s}.fade.d4{animation-delay:.46s}.fade.d5{animation-delay:.58s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* mock primitives, in the product's own visual language */
  .card{background:#fff;border:0.5px solid var(--border);border-radius:8px;padding:11px 13px}
  .lbl{font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .field{background:#fff;border:0.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--ink)}
  .chip{display:inline-block;font-size:11px;padding:4px 9px;border-radius:20px;background:var(--band-bg);color:var(--band-text);font-weight:600}
  .chip.p{background:#f2e6fd;color:var(--purple-deep)}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .row{display:flex;gap:9px;align-items:center}
  .prompt{font-size:12.5px;line-height:1.6;color:var(--sec)}
  .req{background:#fff;border:0.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--sec);display:flex;gap:8px}
  .req b{color:var(--purple);font-weight:600;flex:none}

  .bubble{max-width:78%;font-size:12px;line-height:1.55;padding:9px 12px;border-radius:12px}
  .bubble.child{background:#fff;border:0.5px solid var(--border);border-bottom-right-radius:3px;margin-left:auto}
  .bubble.riv{background:var(--purple-deep);color:#F1EDFB;border-bottom-left-radius:3px}
  .who{font-size:10px;color:var(--muted);margin-bottom:3px}

  .peer{background:#fff;border:0.5px solid var(--border);border-radius:8px;padding:10px}
  .peer .nm{font-size:11.5px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--purple-soft);flex:none}
  .peer p{margin:0;font-size:10.5px;line-height:1.5;color:var(--muted)}

  .bands{display:grid;grid-template-columns:repeat(5,1fr);border:0.5px solid var(--border);border-radius:7px;overflow:hidden;background:#fff}
  .band{padding:6px 4px;text-align:center;border-right:0.5px solid var(--border)}
  .band:last-child{border-right:0}
  .band .bn{font-size:10px;font-weight:600;color:#8b929c}
  .band.on{background:var(--band-bg)}
  .band.on .bn{color:var(--band-text)}

  .course{background:#fff;border:0.5px solid var(--border);border-radius:7px;padding:9px 10px}
  .course .t{font-size:11.5px;font-weight:600;margin-bottom:5px}
  .mini{height:4px;border-radius:3px;background:var(--track);overflow:hidden}
  .mini i{display:block;height:100%;background:var(--grow);border-radius:3px}

  /* ── Narration + controls ─────────────────────────────────── */
  .say{
    margin-top:14px;font-size:13.5px;line-height:1.6;color:var(--sec);
    min-height:44px;border-left:2px solid var(--purple-soft);padding-left:12px;
  }
  .bar-wrap{height:2px;background:var(--border);border-radius:2px;margin-top:14px;overflow:hidden}
  .bar-wrap i{display:block;height:100%;width:0;background:var(--purple);border-radius:2px}

  .ctl{display:flex;align-items:center;gap:8px;margin-top:13px;flex-wrap:wrap}
  button{font-family:inherit;font-size:12px;border-radius:7px;cursor:pointer;transition:all .15s;border:0.5px solid var(--border-strong);background:#fff;color:var(--sec);padding:7px 12px}
  button:hover{border-color:var(--purple);color:var(--purple)}
  button:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
  button.primary{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:600;padding:8px 18px}
  button.primary:hover{background:#7a24c4;color:#fff}
  .spacer{flex:1}
  .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  @media (max-width:820px){
    .frame{grid-template-columns:1fr}
    .rail{border-right:0;border-bottom:0.5px solid var(--border)}
    .growth{display:none}
    .stage{min-height:0;padding:20px 18px}
    .stage h2{font-size:21px}
  }
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none;opacity:1;transform:none}
    .bar i,.mini i,.bar-wrap i{transition:none}
  }
</style>
</head>
<body>

<div class="demo">
  <div class="top">
    <div class="wordmark">Think<span>Smith</span></div>
    <div class="kicker">How it works · six stages</div>
  </div>

  <div class="frame">
    <!-- Rail -->
    <div class="rail">
      <div id="steps"></div>

      <div class="growth" aria-hidden="true">
        <h4>Thinking outcome</h4>
        <div class="sub" id="growthSub">Before the first challenge</div>
        <div id="comps"></div>
      </div>
    </div>

    <!-- Stage -->
    <div class="stage">
      <div class="eyebrow" id="eyebrow">Stage 1 of 6</div>
      <h2 id="title">Register and set up</h2>
      <div class="screen" id="screen"></div>

      <p class="say" id="say" aria-live="polite"></p>
      <div class="bar-wrap"><i id="prog"></i></div>

      <div class="ctl">
        <button class="primary" id="play">▶ Play demo</button>
        <button id="prev">Back</button>
        <button id="next">Next</button>
        <button id="sound" aria-pressed="false">🔇 Sound off</button>
        <div class="spacer"></div>
        <span class="count" id="count">1 / 6</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Five competencies, and where a learner's thinking sits as the journey
  // unfolds. The rail's bars are the demo's signature: rather than describing
  // growth at stage 5, the demo enacts it while you watch.
  var COMPS = [
    { n: "Knowledge & Understanding", v: [56, 60, 66, 72, 78, 82] },
    { n: "Critical Thinking",         v: [52, 57, 64, 72, 79, 84] },
    { n: "Creative Thinking",         v: [54, 57, 62, 67, 71, 74] },
    { n: "Communication",             v: [50, 53, 58, 64, 69, 72] },
    { n: "Application",               v: [55, 58, 63, 69, 74, 78] }
  ];
  var GROWTH_SUB = [
    "Before the first challenge",
    "Starting the first challenge",
    "Working with Ms. Rivera",
    "After reviewing a peer",
    "First Thinking Outcome",
    "Across the whole pathway"
  ];

  var STAGES = [
    {
      title: "Register and set up",
      say: "You create your child's account, tell us their grade, and build their courses from the real curriculum for your province or state. Nothing is generated or guessed \u2014 the courses are matched to what your child is actually expected to learn.",
      html:
        '<div class="fade"><div class="lbl">Add a child</div></div>' +
        '<div class="fade d1 grid2" style="margin-top:8px">' +
          '<div class="field">Noah</div><div class="field">Grade 6 \u25be</div>' +
        '</div>' +
        '<div class="fade d2" style="margin-top:14px"><div class="lbl">Courses built from the Ontario curriculum</div></div>' +
        '<div class="fade d3 grid3" style="margin-top:8px">' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">Mathematics</div><div class="muted" style="font-size:10.5px;margin-top:3px">Number sense \u00b7 Algebra</div></div>' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">Language</div><div class="muted" style="font-size:10.5px;margin-top:3px">Comprehension \u00b7 Writing</div></div>' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">Science</div><div class="muted" style="font-size:10.5px;margin-top:3px">Life systems \u00b7 Matter</div></div>' +
        '</div>' +
        '<div class="fade d4" style="margin-top:14px"><span class="chip">Verified against the curriculum, subject by subject</span></div>'
    },
    {
      title: "Work through real challenges",
      say: "Each course is a sequence of written challenges \u2014 the thinking work that actually matters, not fill-in-the-blank. Your child reads a real scenario, then builds their answer one part at a time.",
      html:
        '<div class="fade"><div class="lbl">Challenge \u00b7 Social Studies \u00b7 Grade 6</div></div>' +
        '<p class="fade d1 prompt" style="margin:7px 0 0">Two accounts describe the same school decision \u2014 the principal\u2019s newsletter and a parent\u2019s post. Investigate what really happened.</p>' +
        '<div class="fade d2" style="margin-top:13px"><div class="lbl">Answer each part in its own box</div></div>' +
        '<div class="fade d3 req" style="margin-top:7px"><b>1</b><span>Write one specific question that would help uncover what happened.</span></div>' +
        '<div class="fade d4 req" style="margin-top:7px"><b>2</b><span>Name two pieces of evidence you would look for, and why each helps.</span></div>' +
        '<div class="fade d5 req" style="margin-top:7px"><b>3</b><span>Say what you can conclude \u2014 and what you still cannot be sure about.</span></div>'
    },
    {
      title: "A companion who guides, not answers",
      say: "Ms. Rivera works alongside your child on every challenge, asking the questions that move their thinking forward. She never hands over the answer \u2014 because the point is the reasoning, not the result.",
      html:
        '<div class="fade"><div class="who">Noah</div><div class="bubble child">The principal is probably right because she works at the school.</div></div>' +
        '<div class="fade d2" style="margin-top:11px"><div class="who">Ms. Rivera</div>' +
          '<div class="bubble riv">That\u2019s a fair starting point. What would make her account more reliable than the parent\u2019s \u2014 and is there anything she might not have seen?</div></div>' +
        '<div class="fade d4" style="margin-top:11px"><div class="who">Noah</div>' +
          '<div class="bubble child">She wasn\u2019t at recess, so she might not know what the older kids do.</div></div>' +
        '<div class="fade d5" style="margin-top:12px"><span class="chip p">A question back, never the answer</span></div>'
    },
    {
      title: "Peers who push back",
      say: "Your child reviews another student's work and responds to feedback on their own \u2014 the part that turns a solo worksheet into real reasoning. Every peer is written by ThinkSmith, so your child never talks to a stranger.",
      html:
        '<div class="fade"><div class="lbl">Review a peer\u2019s answer</div></div>' +
        '<div class="fade d1 grid3" style="margin-top:8px">' +
          '<div class="peer"><div class="nm"><span class="dot"></span>Maya</div><p>Says the principal is right because she is in charge.</p></div>' +
          '<div class="peer"><div class="nm"><span class="dot"></span>Reese</div><p>Notices both accounts leave out the older students.</p></div>' +
          '<div class="peer"><div class="nm"><span class="dot"></span>Seth</div><p>Asks who was actually consulted, and when.</p></div>' +
        '</div>' +
        '<div class="fade d3" style="margin-top:13px"><div class="lbl">Noah\u2019s feedback to Reese</div>' +
          '<div class="field" style="margin-top:6px;line-height:1.55">You spotted the gap I missed \u2014 neither account asks the older kids. I\u2019d add that the parent only heard it second-hand.</div></div>' +
        '<div class="fade d5" style="margin-top:11px"><span class="chip p">Peers are written by ThinkSmith \u2014 never other children</span></div>'
    },
    {
      title: "See thinking grow",
      say: "Every topic produces a Thinking Outcome \u2014 an honest read of where your child's thinking sits and how far it has come, across five competencies. You can print it and keep it.",
      html:
        '<div class="fade"><div class="lbl">Thinking Outcome \u00b7 Social Studies</div></div>' +
        '<div class="fade d1 bands" style="margin-top:9px">' +
          '<div class="band"><div class="bn">Not yet</div></div>' +
          '<div class="band"><div class="bn">Emerging</div></div>' +
          '<div class="band"><div class="bn">Developing</div></div>' +
          '<div class="band on"><div class="bn">Proficient</div></div>' +
          '<div class="band"><div class="bn">Extending</div></div>' +
        '</div>' +
        '<div class="fade d2" style="margin-top:12px">' +
          '<div class="card"><div class="row" style="justify-content:space-between"><span style="font-size:11.5px;font-weight:600">Critical Thinking</span><span class="muted" style="font-size:10.5px">Start 52 \u2192 Now 84</span></div>' +
          '<div class="mini" style="margin-top:6px"><i style="width:84%"></i></div></div>' +
        '</div>' +
        '<div class="fade d3" style="margin-top:9px">' +
          '<div class="card"><div class="row" style="justify-content:space-between"><span style="font-size:11.5px;font-weight:600">Communication</span><span class="muted" style="font-size:10.5px">Start 50 \u2192 Now 72</span></div>' +
          '<div class="mini" style="margin-top:6px"><i style="width:72%"></i></div></div>' +
        '</div>' +
        '<div class="fade d5" style="margin-top:11px"><span class="chip">Printable readiness record</span></div>'
    },
    {
      title: "Watch the whole pathway",
      say: "Track readiness across every course, see university and college preparation streams side by side, and know at a glance what is complete and what comes next.",
      html:
        '<div class="fade row" style="justify-content:space-between"><div class="lbl">Grade pathway</div><span class="chip">4 of 6 topics complete</span></div>' +
        '<div class="fade d1 grid2" style="margin-top:9px">' +
          '<div class="course"><div class="t">Mathematics</div><div class="mini"><i style="width:82%"></i></div></div>' +
          '<div class="course"><div class="t">Language</div><div class="mini"><i style="width:66%"></i></div></div>' +
          '<div class="course"><div class="t">Science</div><div class="mini"><i style="width:74%"></i></div></div>' +
          '<div class="course"><div class="t">Social Studies</div><div class="mini"><i style="width:78%"></i></div></div>' +
        '</div>' +
        '<div class="fade d3" style="margin-top:13px"><div class="lbl">Senior streams</div></div>' +
        '<div class="fade d4 grid2" style="margin-top:7px">' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">University preparation</div><div class="muted" style="font-size:10.5px;margin-top:3px">Grade 11 \u2013 12 \u00b7 on track</div></div>' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">College preparation</div><div class="muted" style="font-size:10.5px;margin-top:3px">Grade 11 \u2013 12 \u00b7 available</div></div>' +
        '</div>'
    }
  ];

  var HOLD = [13500, 14500, 15500, 15500, 14500, 14000];

  var $ = function (id) { return document.getElementById(id); };
  var stepsEl = $("steps"), compsEl = $("comps"), screenEl = $("screen");
  var titleEl = $("title"), eyebrowEl = $("eyebrow"), sayEl = $("say");
  var progEl = $("prog"), countEl = $("count"), growthSub = $("growthSub");
  var playBtn = $("play"), prevBtn = $("prev"), nextBtn = $("next"), soundBtn = $("sound");

  var i = 0, playing = false, sound = false, timer = null, raf = null, t0 = 0;
  var usingAudio = false;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  // Build the rail once.
  STAGES.forEach(function (s, k) {
    var d = document.createElement("div");
    d.className = "step"; d.tabIndex = 0; d.setAttribute("role", "button");
    d.innerHTML = '<span class="num">' + (k + 1) + '</span><span class="slabel">' + s.title + '</span>';
    d.addEventListener("click", function () { go(k); });
    d.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(k); }
    });
    stepsEl.appendChild(d);
  });

  COMPS.forEach(function (c) {
    var d = document.createElement("div");
    d.className = "comp";
    d.innerHTML = '<div class="cn"><span>' + c.n + '</span><b>0</b></div><div class="bar"><i></i></div>';
    compsEl.appendChild(d);
  });
  var compBars = compsEl.querySelectorAll(".bar i");
  var compVals = compsEl.querySelectorAll(".cn b");

  // ── Narration ────────────────────────────────────────────────────────────
  // Six pre-generated files: audio/stage-1.mp3 ... stage-6.mp3.
  //
  // Pre-generated deliberately, NOT synthesised at runtime. A TTS call from
  // this page would publish an API key to every visitor, cost money on every
  // play, and add latency before the first word. Files are free, instant and
  // work offline.
  //
  // If a file is missing the demo does not break: onerror flips that stage to
  // the fixed fallback timing, so the walkthrough still runs while narration
  // is still being recorded. That also means swapping Polly for a human
  // voiceover later is a file drop, not a code change.
  var tracks = [], trackOk = [];
  for (var a = 0; a < STAGES.length; a++) {
    (function (k) {
      var el = new Audio("audio/stage-" + (k + 1) + ".mp3");
      el.preload = "auto";
      trackOk[k] = null;                       // null = unknown yet
      el.addEventListener("canplaythrough", function () { trackOk[k] = true; });
      el.addEventListener("error", function () { trackOk[k] = false; });
      el.addEventListener("ended", function () { if (playing) advance(); });
      tracks[k] = el;
    })(a);
  }

  function stopAudio() {
    tracks.forEach(function (t) { try { t.pause(); t.currentTime = 0; } catch (e) {} });
  }

  function speak() {
    stopAudio();
    if (!sound) return false;
    var t = tracks[i];
    if (trackOk[i] === false) return false;    // no file: caller uses the timer
    var p = t.play();
    if (p && p.catch) p.catch(function () { trackOk[i] = false; });
    return true;
  }

  function paintGrowth() {
    COMPS.forEach(function (c, k) {
      compBars[k].style.width = c.v[i] + "%";
      compVals[k].textContent = c.v[i];
    });
    growthSub.textContent = GROWTH_SUB[i];
  }

  function render() {
    var s = STAGES[i];
    eyebrowEl.textContent = "Stage " + (i + 1) + " of " + STAGES.length;
    titleEl.textContent = s.title;
    sayEl.textContent = s.say;
    countEl.textContent = (i + 1) + " / " + STAGES.length;
    screenEl.innerHTML = s.html;

    var steps = stepsEl.children;
    for (var k = 0; k < steps.length; k++) {
      steps[k].className = "step" + (k < i ? " done" : k === i ? " now" : "");
    }
    paintGrowth();
  }

  function tick() {
    if (!playing) return;
    var pct;
    var t = tracks[i];
    // When narration is playing, the bar tracks the AUDIO, so the visuals and
    // the voice cannot drift apart however long a take runs. Only when there
    // is no audio does it fall back to the fixed hold.
    if (usingAudio && t.duration && isFinite(t.duration)) {
      pct = Math.min(1, t.currentTime / t.duration);
    } else {
      pct = Math.min(1, (Date.now() - t0) / HOLD[i]);
    }
    progEl.style.width = (pct * 100) + "%";
    if (pct < 1) raf = requestAnimationFrame(tick);
  }

  function advance() {
    if (i < STAGES.length - 1) { i++; render(); schedule(); }
    else { stop(true); }
  }

  function schedule() {
    clearTimeout(timer); cancelAnimationFrame(raf);
    t0 = Date.now(); progEl.style.width = "0%";
    usingAudio = speak();
    if (!reduced) raf = requestAnimationFrame(tick);
    // With audio, the 'ended' event advances the stage. The timer is only a
    // safety net for a track that never fires 'ended' (a corrupt file, say).
    var wait = usingAudio ? 120000 : HOLD[i];
    timer = setTimeout(function () { advance(); }, wait);
  }

  function go(k) { stop(false); i = k; render(); }

  function play() {
    playing = true;
    playBtn.textContent = "❚❚ Pause";
    render(); schedule();
  }
  function stop(finished) {
    playing = false;
    clearTimeout(timer); cancelAnimationFrame(raf);
    stopAudio(); usingAudio = false;
    playBtn.textContent = finished ? "↻ Watch again" : "▶ Play demo";
    if (finished) { progEl.style.width = "100%"; }
  }

  playBtn.addEventListener("click", function () {
    if (playing) { stop(false); return; }
    if (i === STAGES.length - 1 && progEl.style.width === "100%") { i = 0; }
    play();
  });
  nextBtn.addEventListener("click", function () {
    go(Math.min(STAGES.length - 1, i + 1));
  });
  prevBtn.addEventListener("click", function () {
    go(Math.max(0, i - 1));
  });
  soundBtn.addEventListener("click", function () {
    sound = !sound;
    soundBtn.textContent = sound ? "🔊 Sound on" : "🔇 Sound off";
    soundBtn.setAttribute("aria-pressed", sound ? "true" : "false");
    // Toggling mid-stage re-syncs: restart the stage so voice and visuals
    // begin together rather than the audio starting halfway through.
    if (!sound) { stopAudio(); usingAudio = false; }
    else if (playing) { schedule(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") nextBtn.click();
    if (e.key === "ArrowLeft") prevBtn.click();
  });

  render();
})();
</script>
</body>
</html>
