<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThinkSmith — how it works</title>
<style>
  :root{
    --font-sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
    --ink:#1f2430; --sec:#5b6270; --muted:#9aa2ad;
    --border:#e6e7ec; --border-strong:#d3d5dc;
    --paper:#ffffff; --shell:#faf8fd;
    --purple:#8C2DDF; --purple-deep:#3C2A6B; --purple-wash:#F8F1FC; --purple-soft:#D9C4F2;
    --grow:#7cb342; --grow-deep:#5f9b28; --band-bg:#edf6e0; --band-text:#4f7a1f;
    --track:#eef0f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--shell);font-family:var(--font-sans);color:var(--ink);
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px;
  }

  .demo{width:100%;max-width:900px}

  /* ── Masthead ─────────────────────────────────────────────── */
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px;flex-wrap:wrap}
  .wordmark{font-size:15px;font-weight:600;letter-spacing:-0.01em}
  .wordmark span{color:var(--purple)}
  .kicker{font-size:11px;color:var(--muted);letter-spacing:0.09em;text-transform:uppercase}

  /* ── Frame ────────────────────────────────────────────────── */
  .frame{
    display:block;
    background:var(--paper);border:0.5px solid var(--border);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(31,36,48,.04),0 12px 40px rgba(60,42,107,.07);
  }

  /* ── Stage ────────────────────────────────────────────────── */
  .stage{padding:26px 30px 22px;min-height:452px;display:flex;flex-direction:column}
  .eyebrow{font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--purple);font-weight:600;margin-bottom:7px}
  .stage h2{margin:0 0 16px;font-size:25px;font-weight:400;letter-spacing:-0.022em;line-height:1.2;max-width:22ch}

  .screen{flex:1;background:var(--shell);border:0.5px solid var(--border);border-radius:10px;padding:16px 17px;position:relative;overflow:hidden}
  .fade{opacity:0;transform:translateY(7px);animation:rise .5s cubic-bezier(.22,.9,.3,1) forwards}
  .fade.d1{animation-delay:.10s}.fade.d2{animation-delay:.22s}
  .fade.d3{animation-delay:.34s}.fade.d4{animation-delay:.46s}.fade.d5{animation-delay:.58s}
  @keyframes rise{to{opacity:1;transform:none}}

  /* mock primitives, in the product's own visual language */
  .card{background:#fff;border:0.5px solid var(--border);border-radius:8px;padding:11px 13px}
  .lbl{font-size:10px;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .field{background:#fff;border:0.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--ink)}
  .chip{display:inline-block;font-size:11px;padding:4px 9px;border-radius:20px;background:var(--band-bg);color:var(--band-text);font-weight:600}
  .chip.p{background:#f2e6fd;color:var(--purple-deep)}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .row{display:flex;gap:9px;align-items:center}
  .prompt{font-size:12.5px;line-height:1.6;color:var(--sec)}
  .req{background:#fff;border:0.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--sec);display:flex;gap:8px}
  .req b{color:var(--purple);font-weight:600;flex:none}

  .bubble{max-width:78%;font-size:12px;line-height:1.55;padding:9px 12px;border-radius:12px}
  .bubble.child{background:#fff;border:0.5px solid var(--border);border-bottom-right-radius:3px;margin-left:auto}
  .bubble.riv{background:var(--purple-deep);color:#F1EDFB;border-bottom-left-radius:3px}
  .who{font-size:10px;color:var(--muted);margin-bottom:3px}

  .peer{background:#fff;border:0.5px solid var(--border);border-radius:8px;padding:10px}
  .peer .nm{font-size:11.5px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--purple-soft);flex:none}
  .peer p{margin:0;font-size:10.5px;line-height:1.5;color:var(--muted)}

  .bands{display:grid;grid-template-columns:repeat(5,1fr);border:0.5px solid var(--border);border-radius:7px;overflow:hidden;background:#fff}
  .band{padding:6px 4px;text-align:center;border-right:0.5px solid var(--border)}
  .band:last-child{border-right:0}
  .band .bn{font-size:10px;font-weight:600;color:#8b929c}
  .band.on{background:var(--band-bg)}
  .band.on .bn{color:var(--band-text)}

  .course{background:#fff;border:0.5px solid var(--border);border-radius:7px;padding:9px 10px}
  .course .t{font-size:11.5px;font-weight:600;margin-bottom:5px}
  .mini{height:4px;border-radius:3px;background:var(--track);overflow:hidden}
  .mini i{display:block;height:100%;background:var(--grow);border-radius:3px}

  /* ── Stage 2: illustrated challenge (deserts map) ─────────────
     Four layers build up in order, no captions: deserts, then ocean
     currents, then prevailing winds, then pressure belts. Pure CSS delays,
     so they restart each time the stage is shown, with or without audio. */
  .chq{font-size:16px;font-weight:600;line-height:1.35;color:var(--purple-deep);margin:0 0 10px}
  .dmap{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;background:#d8e9f5;border-radius:8px}
  .dl{opacity:0;animation:dlin .9s ease forwards}
  .dl.l1{animation-delay:.6s}.dl.l2{animation-delay:3.6s}.dl.l3{animation-delay:7s}.dl.l4{animation-delay:10.4s}
  @keyframes dlin{to{opacity:1}}
  .dflow{stroke-dasharray:14 6;animation:dflow 1.6s linear infinite}
  @keyframes dflow{to{stroke-dashoffset:-40}}

  /* ── Stage 0: the intro ───────────────────────────────────── */
  .intro{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6px 0}
  .intro .brand{font-size:31px;font-weight:600;letter-spacing:-0.03em;color:var(--purple);line-height:1.1}
  .intro .line2{font-size:25px;font-weight:300;letter-spacing:-0.02em;line-height:1.28;margin-top:6px;color:var(--ink)}
  .intro .line3{font-size:14px;color:var(--sec);margin-top:12px}

  .rbands{display:grid;grid-template-columns:repeat(5,1fr);width:100%;border:0.5px solid var(--border);border-radius:7px 7px 0 0;overflow:hidden;background:#fff;margin-top:24px}
  .rband{padding:7px 4px;text-align:center;border-right:0.5px solid var(--border)}
  .rband:last-child{border-right:0}
  .rband .bn{font-size:10.5px;font-weight:600;color:#8b929c;line-height:1.3}
  .rband .bp{font-size:9.5px;color:var(--muted);margin-top:1px}
  .rband.on{background:var(--band-bg)}
  .rband.on .bn{color:var(--band-text)}

  /* The readiness line. Zero width until released by a cue tied to the
     narration, so it draws exactly as the phrase is spoken. */
  .rtrack{position:relative;width:100%;height:46px;background:#f6f7f9;border:0.5px solid var(--border);border-top:0;border-radius:0 0 7px 7px}
  .rfill{position:absolute;top:50%;left:48%;height:4px;width:0;background:var(--grow);border-radius:3px;transform:translateY(-50%);transition:width 2.6s cubic-bezier(.25,.85,.3,1)}
  .rfill.go{width:38%}
  .rdot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%)}
  .rdot.a{left:48%;background:#fff;border:2.5px solid var(--grow)}
  .rdot.b{left:48%;background:var(--grow);opacity:0;transition:left 2.6s cubic-bezier(.25,.85,.3,1),opacity .4s}
  .rfill.go ~ .rdot.b{left:86%;opacity:1}

  /* ── Narration + controls ─────────────────────────────────── */
  .say{
    margin-top:14px;font-size:13.5px;line-height:1.6;color:var(--sec);
    min-height:44px;border-left:2px solid var(--purple-soft);padding-left:12px;
  }
  .bar-wrap{height:2px;background:var(--border);border-radius:2px;margin-top:14px;overflow:hidden}
  .bar-wrap i{display:block;height:100%;width:0;background:var(--purple);border-radius:2px}

  .ctl{display:flex;align-items:center;gap:8px;margin-top:13px;flex-wrap:wrap}
  button{font-family:inherit;font-size:12px;border-radius:7px;cursor:pointer;transition:all .15s;border:0.5px solid var(--border-strong);background:#fff;color:var(--sec);padding:7px 12px}
  button:hover{border-color:var(--purple);color:var(--purple)}
  button:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
  button.primary{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:600;padding:8px 18px}
  button.primary:hover{background:#7a24c4;color:#fff}
  .spacer{flex:1}
  .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  @media (max-width:820px){
    .stage{min-height:0;padding:20px 18px}
    .stage h2{font-size:21px}
  }
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none;opacity:1;transform:none}
    .dl{animation:none;opacity:1}.dflow{animation:none}
    .bar i,.mini i,.bar-wrap i{transition:none}
  }
</style>
</head>
<body>

<div class="demo">
  <div class="top">
    <div class="wordmark">Think<span>Smith</span></div>
    <div class="kicker">How it works · six stages</div>
  </div>

  <div class="frame">
    <!-- Stage -->
    <div class="stage">
      <div class="eyebrow" id="eyebrow">Stage 1 of 6</div>
      <h2 id="title">Register and set up</h2>
      <div class="screen" id="screen"></div>

      <p class="say" id="say" aria-live="polite"></p>
      <div class="bar-wrap"><i id="prog"></i></div>

      <div class="ctl">
        <button class="primary" id="play">▶ Play demo</button>
        <button id="prev">Back</button>
        <button id="next">Next</button>
        <button id="sound" aria-pressed="true">🔊 Sound on</button>
        <div class="spacer"></div>
        <span class="count" id="count">1 / 6</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STAGES = [
    {
      // Stage 0. Everything is on screen from the first frame EXCEPT the
      // readiness line, which is released by `cue` \u2014 a fraction of the
      // narration's duration \u2014 so it draws precisely as "from first day to
      // thinking readiness" is spoken. Without audio it falls back to the same
      // fraction of the fixed hold.
      intro: true,
      cue: 0.58,
      title: "",
      say: "ThinkSmith. One platform, the whole journey. From first day to thinking readiness.",
      html:
        '<div class="intro">' +
          '<div class="fade brand">ThinkSmith</div>' +
          '<div class="fade d1 line2">One platform,<br/>the whole journey</div>' +
          '<div class="fade d2 line3">From first day to thinking readiness.</div>' +
          '<div class="fade d3 rbands">' +
            '<div class="rband"><div class="bn">Not yet</div><div class="bp">&lt;50%</div></div>' +
            '<div class="rband"><div class="bn">Emerging</div><div class="bp">50\u201359%</div></div>' +
            '<div class="rband"><div class="bn">Developing</div><div class="bp">60\u201369%</div></div>' +
            '<div class="rband on"><div class="bn">Proficient</div><div class="bp">70\u201379%</div></div>' +
            '<div class="rband"><div class="bn">Exemplary</div><div class="bp">80+%</div></div>' +
          '</div>' +
          '<div class="fade d3 rtrack">' +
            '<i class="rfill" id="rfill"></i>' +
            '<span class="rdot a"></span><span class="rdot b"></span>' +
          '</div>' +
        '</div>'
    },
    {
      title: "Register and set up",
      say: "Get started by creating your child's account, selecting their grade, and building courses directly from your province or state's official curriculum. Nothing is generated or guessed at \u2014 every course is precise, verified, and mapped to what your child is expected to learn.",
      html:
        '<div class="fade"><div class="lbl">Add a child</div></div>' +
        '<div class="fade d1 grid2" style="margin-top:8px">' +
          '<div class="field">Noah</div><div class="field">Grade 6 \u25be</div>' +
        '</div>' +
        '<div class="fade d2" style="margin-top:14px"><div class="lbl">Courses built from the Ontario curriculum</div></div>' +
        '<div class="fade d3 grid3" style="margin-top:8px">' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">Mathematics</div><div class="muted" style="font-size:10.5px;margin-top:3px">Number sense \u00b7 Algebra</div></div>' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">Language</div><div class="muted" style="font-size:10.5px;margin-top:3px">Comprehension \u00b7 Writing</div></div>' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">Science</div><div class="muted" style="font-size:10.5px;margin-top:3px">Life systems \u00b7 Matter</div></div>' +
        '</div>' +
        '<div class="fade d4" style="margin-top:14px"><span class="chip">Verified against the curriculum, subject by subject</span></div>'
    },
    {
      title: "Work through real challenges",
      say: "Each course is a sequence of written challenges \u2014 your child's thinking is what matters, not fill-in-the-blank. Your child engages in a real scenario that builds their confidence and thinking outcome one step at a time.",
      html:
        // Illustrated challenge (21 Oct 2026): the question, then the model
        // continent. Layers appear one after another and stay on.
        '<p class="fade chq">Why do deserts form on the west sides of continents?</p>' +
        '<svg class="fade d1 dmap" viewBox="0 0 760 460" role="img" aria-label="A model continent: deserts appear on its west side near 30 degrees north and south, then cold ocean currents, trade winds and high-pressure belts appear in turn">' +
          '<defs>' +
            '<marker id="dm-cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f6fb2"/></marker>' +
            '<marker id="dm-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>' +
            '<marker id="dm-wind" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker>' +
          '</defs>' +
          '<path d="M300 50 C380 40 470 60 500 110 C530 160 560 190 540 240 C520 290 500 330 450 380 C410 420 360 425 330 395 C300 360 290 320 270 280 C250 240 230 200 245 150 C255 100 260 60 300 50 Z" fill="#b9d79a" stroke="#7da35a" stroke-width="2"/>' +
          '<path d="M0 230H760" stroke="#3C2A6B" stroke-width="1.5" stroke-dasharray="2 6"/>' +
          '<path d="M0 130H760M0 330H760" stroke="#5b6270" stroke-dasharray="8 6"/>' +
          '<text x="12" y="224" font-size="14" font-weight="600" fill="#3C2A6B">Equator</text>' +
          '<text x="12" y="124" font-size="14" fill="#374151">30\u00b0 N</text>' +
          '<text x="12" y="324" font-size="14" fill="#374151">30\u00b0 S</text>' +
          '<text x="130" y="448" font-size="15" font-weight="700" fill="#374151">WEST</text>' +
          '<text x="590" y="448" font-size="15" font-weight="700" fill="#374151">EAST</text>' +
          // 4 \u2014 pressure belts (appear LAST, but drawn first so they sit under the
          // deserts, currents and winds, as in the makeover mock-up)
          '<g class="dl l4">' +
            '<rect x="0" y="112" width="760" height="36" fill="#8C2DDF" opacity=".16"/>' +
            '<rect x="0" y="312" width="760" height="36" fill="#8C2DDF" opacity=".16"/>' +
          '</g>' +
          // 1 \u2014 deserts
          '<g class="dl l1">' +
            '<path d="M252 140 C262 120 300 118 315 135 C328 152 310 178 285 182 C262 186 246 162 252 140 Z" fill="#e3b86a" stroke="#b07400" stroke-width="1.5"/>' +
            '<path d="M282 300 C292 282 330 284 340 302 C350 320 332 346 308 346 C286 346 274 320 282 300 Z" fill="#e3b86a" stroke="#b07400" stroke-width="1.5"/>' +
          '</g>' +
          // 2 \u2014 ocean currents (cold up the west coast, warm down the east)
          '<g class="dl l2">' +
            '<path class="dflow" d="M210 70 C200 120 205 170 225 205" fill="none" stroke="#1f6fb2" stroke-width="6" marker-end="url(#dm-cold)"/>' +
            '<path class="dflow" d="M235 410 C220 360 225 300 240 255" fill="none" stroke="#1f6fb2" stroke-width="6" marker-end="url(#dm-cold)"/>' +
            '<path class="dflow" d="M565 205 C580 160 570 110 545 70" fill="none" stroke="#c2410c" stroke-width="6" marker-end="url(#dm-warm)"/>' +
            '<path class="dflow" d="M560 255 C575 300 540 360 500 410" fill="none" stroke="#c2410c" stroke-width="6" marker-end="url(#dm-warm)"/>' +
          '</g>' +
          // 3 \u2014 prevailing (trade) winds, east to west
          '<g class="dl l3">' +
            '<path class="dflow" d="M700 160 C560 175 400 190 120 205" fill="none" stroke="#4b5563" stroke-width="4" marker-end="url(#dm-wind)"/>' +
            '<path class="dflow" d="M700 300 C560 285 400 270 120 255" fill="none" stroke="#4b5563" stroke-width="4" marker-end="url(#dm-wind)"/>' +
          '</g>' +
        '</svg>'
    },
    {
      title: "A personal learning companion",
      say: "A personal learning companion who responds to your child's thinking. Ms. Rivera guides your child through every challenge with targeted prompts that deepen their understanding. She never hands over the answer \u2014 because mastering the reasoning is what matters, not just getting the result.",
      html:
        '<div class="fade"><div class="who">Noah</div><div class="bubble child">The principal is probably right because she works at the school.</div></div>' +
        '<div class="fade d2" style="margin-top:11px"><div class="who">Ms. Rivera</div>' +
          '<div class="bubble riv">That\u2019s a fair starting point. What would make her account more reliable than the parent\u2019s \u2014 and is there anything she might not have seen?</div></div>' +
        '<div class="fade d4" style="margin-top:11px"><div class="who">Noah</div>' +
          '<div class="bubble child">She wasn\u2019t at recess, so she might not know what the older kids do.</div></div>' +
        '<div class="fade d5" style="margin-top:12px"><span class="chip p">A question back, never the answer</span></div>'
    },
    {
      title: "Peers who push back",
      say: "The hardest part of learning at home is missing out on a classroom of peers solving the same problem in different ways. ThinkSmith bridges that gap by giving your child three peer solutions to evaluate on every activity. As they analyse varying approaches and receive feedback on their own work, learners are prompted to rethink, refine, and improve their understanding.",
      html:
        '<div class="fade"><div class="lbl">Review a peer\u2019s answer</div></div>' +
        '<div class="fade d1 grid3" style="margin-top:8px">' +
          '<div class="peer"><div class="nm"><span class="dot"></span>Maya</div><p>Says the principal is right because she is in charge.</p></div>' +
          '<div class="peer"><div class="nm"><span class="dot"></span>Reese</div><p>Notices both accounts leave out the older students.</p></div>' +
          '<div class="peer"><div class="nm"><span class="dot"></span>Seth</div><p>Asks who was actually consulted, and when.</p></div>' +
        '</div>' +
        '<div class="fade d3" style="margin-top:13px"><div class="lbl">Noah\u2019s feedback to Reese</div>' +
          '<div class="field" style="margin-top:6px;line-height:1.55">You spotted the gap I missed \u2014 neither account asks the older kids. I\u2019d add that the parent only heard it second-hand.</div></div>' +
        '<div class="fade d5" style="margin-top:11px"><span class="chip p">Peers are written by ThinkSmith \u2014 never other children</span></div>'
    },
    {
      title: "See thinking grow",
      say: "Every challenge generates a Thinking Outcome \u2014 a clear, honest snapshot of your child's current mastery and growth across five core competencies. Parents can track their progress, and see exactly when they are ready to advance to the next level.",
      html:
        '<div class="fade"><div class="lbl">Thinking Outcome \u00b7 Social Studies</div></div>' +
        '<div class="fade d1 bands" style="margin-top:9px">' +
          '<div class="band"><div class="bn">Not yet</div></div>' +
          '<div class="band"><div class="bn">Emerging</div></div>' +
          '<div class="band"><div class="bn">Developing</div></div>' +
          '<div class="band on"><div class="bn">Proficient</div></div>' +
          '<div class="band"><div class="bn">Exemplary</div></div>' +
        '</div>' +
        '<div class="fade d2" style="margin-top:12px">' +
          '<div class="card"><div class="row" style="justify-content:space-between"><span style="font-size:11.5px;font-weight:600">Critical Thinking</span><span class="muted" style="font-size:10.5px">Start 52 \u2192 Now 84</span></div>' +
          '<div class="mini" style="margin-top:6px"><i style="width:84%"></i></div></div>' +
        '</div>' +
        '<div class="fade d3" style="margin-top:9px">' +

        '</div>' +
        '<div class="fade d5" style="margin-top:11px"><span class="chip">Printable readiness record</span></div>'
    },
    {
      title: "Watch the whole pathway",
      say: "Track your child's academic readiness across every course, compare college and university pathways side by side, and immediately see what they've accomplished \u2014 and what's next on their journey. ThinkSmith. One platform, the whole journey. From first day to thinking readiness.",
      html:
        '<div class="fade row" style="justify-content:space-between"><div class="lbl">Grade pathway</div><span class="chip">4 of 6 topics complete</span></div>' +
        '<div class="fade d1 grid2" style="margin-top:9px">' +
          '<div class="course"><div class="t">Mathematics</div><div class="mini"><i style="width:82%"></i></div></div>' +
          '<div class="course"><div class="t">Language</div><div class="mini"><i style="width:66%"></i></div></div>' +

          '<div class="course"><div class="t">Social Studies</div><div class="mini"><i style="width:78%"></i></div></div>' +
        '</div>' +
        '<div class="fade d3" style="margin-top:13px"><div class="lbl">Senior streams</div></div>' +
        '<div class="fade d4 grid2" style="margin-top:7px">' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">University preparation</div><div class="muted" style="font-size:10.5px;margin-top:3px">Grade 11 \u2013 12 \u00b7 on track</div></div>' +
          '<div class="card"><div style="font-size:11.5px;font-weight:600">College preparation</div><div class="muted" style="font-size:10.5px;margin-top:3px">Grade 11 \u2013 12 \u00b7 available</div></div>' +
        '</div>'
    }
  ];

  // Fallback pacing only — used when a narration file is missing. When audio
  // is present the stage advances on the track's 'ended' event instead.
  var HOLD = [11000, 15200, 14933, 19533, 24666, 16666, 18800];

  var $ = function (id) { return document.getElementById(id); };
  var screenEl = $("screen");
  var titleEl = $("title"), eyebrowEl = $("eyebrow"), sayEl = $("say");
  var progEl = $("prog"), countEl = $("count");
  var playBtn = $("play"), prevBtn = $("prev"), nextBtn = $("next"), soundBtn = $("sound");

  var i = 0, playing = false, sound = true, timer = null, raf = null, t0 = 0;
  var usingAudio = false;
  var cueTimer = null, cueFired = false;
  // Which stage is currently painted. render() rewrites screen innerHTML, so
  // calling it on a stage already displayed replays every fade-in — which on
  // the intro looked like the whole panel flashing and rebuilding the moment
  // Play was pressed.
  var painted = -1;

  // Releases a stage's cued element \u2014 currently the intro's readiness line.
  function fireCue() {
    if (cueFired) return;
    cueFired = true;
    var el = document.getElementById("rfill");
    if (el) el.classList.add("go");
  }
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

  // ── Narration ────────────────────────────────────────────────────────────
  // Six pre-generated files: audio/stage-1.mp3 ... stage-6.mp3.
  //
  // Pre-generated deliberately, NOT synthesised at runtime. A TTS call from
  // this page would publish an API key to every visitor, cost money on every
  // play, and add latency before the first word. Files are free, instant and
  // work offline.
  //
  // If a file is missing the demo does not break: onerror flips that stage to
  // the fixed fallback timing, so the walkthrough still runs while narration
  // is still being recorded.
  var tracks = [], trackOk = [];
  for (var a = 0; a < STAGES.length; a++) {
    (function (k) {
      // Index maps DIRECTLY to the filename: index 0 is the intro and plays
      // stage-0.mp3. This was k+1 before Stage 0 existed, which made every
      // stage play the next one’s narration.
      var el = new Audio("audio/stage-" + k + ".mp3");
      el.preload = "auto";
      trackOk[k] = null;
      el.addEventListener("canplaythrough", function () { trackOk[k] = true; });
      el.addEventListener("error", function () { trackOk[k] = false; });
      el.addEventListener("ended", function () { if (playing) advance(); });
      tracks[k] = el;
    })(a);
  }

  function stopAudio() {
    tracks.forEach(function (t) { try { t.pause(); t.currentTime = 0; } catch (e) {} });
  }

  function speak() {
    stopAudio();
    if (!sound) return false;
    var k = i, t = tracks[k];
    if (trackOk[k] === false) return false;    // known missing: use the timer
    // play() may reject asynchronously (missing file, blocked autoplay) AFTER
    // we have already returned true. Without handling that, the demo believes
    // narration is running, the cue never fires and the stage waits on the
    // 120s safety timer. On failure we drop that stage back to timer pacing.
    try {
      var p = t.play();
      if (p && p.catch) {
        p.catch(function () { trackOk[k] = false; useTimerPacing(k); });
      }
    } catch (e) {
      trackOk[k] = false;
      return false;
    }
    // Belt and braces: play() can also fail SILENTLY \u2014 returning nothing and
    // never starting \u2014 in environments with no media support. Neither the catch
    // above nor the promise rejection sees that, so confirm shortly afterwards
    // that playback genuinely began, and drop to timer pacing if it did not.
    setTimeout(function () {
      if (playing && i === k && t.paused) { trackOk[k] = false; useTimerPacing(k); }
    }, 400);
    return true;
  }

  // Re-paces the CURRENT stage on the fallback clock. Guarded on stage index so
  // a late rejection from a stage the viewer has already left cannot hijack the
  // one now on screen.
  function useTimerPacing(k) {
    if (!playing || i !== k) return;
    usingAudio = false;
    clearTimeout(timer); clearTimeout(cueTimer);
    t0 = Date.now();
    var cue = STAGES[k].cue;
    if (cue && !cueFired) cueTimer = setTimeout(fireCue, HOLD[k] * cue);
    timer = setTimeout(function () { advance(); }, HOLD[k]);
  }

  function paintGrowth() {
    COMPS.forEach(function (c, k) {
      compBars[k].style.width = c.v[i] + "%";
      compVals[k].textContent = c.v[i];
    });
    growthSub.textContent = GROWTH_SUB[i];
  }

  function render() {
    var s = STAGES[i];
    var isIntro = !!s.intro;
    eyebrowEl.textContent = isIntro ? "" : "Stage " + i + " of " + (STAGES.length - 1);
    titleEl.textContent = s.title;
    titleEl.style.display = s.title ? "" : "none";
    sayEl.textContent = s.say;
    countEl.textContent = isIntro ? "Intro" : i + " / " + (STAGES.length - 1);
    screenEl.innerHTML = s.html;
    painted = i;

  }

  function tick() {
    if (!playing) return;
    var pct;
    var t = tracks[i];
    // When narration is playing, the bar tracks the AUDIO, so the visuals and
    // the voice cannot drift apart however long a take runs. Only when there
    // is no audio does it fall back to the fixed hold.
    if (usingAudio && t.duration && isFinite(t.duration)) {
      pct = Math.min(1, t.currentTime / t.duration);
    } else {
      pct = Math.min(1, (Date.now() - t0) / HOLD[i]);
    }
    progEl.style.width = (pct * 100) + "%";
    if (pct < 1) raf = requestAnimationFrame(tick);
  }

  // A held beat between stages. Without it the next stage snaps in the instant
  // the narrator stops speaking, which reads as rushed and gives no moment to
  // take in the panel that was just described.
  var STAGE_GAP = 1600;

  function advance() {
    if (i >= STAGES.length - 1) { stop(true); return; }
    stopAudio(); usingAudio = false;
    cancelAnimationFrame(raf);
    progEl.style.width = "100%";
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (!playing) return;
      i++; render(); schedule();
    }, STAGE_GAP);
  }

  function schedule() {
    clearTimeout(timer); cancelAnimationFrame(raf);
    clearTimeout(cueTimer); cueFired = false;
    t0 = Date.now(); progEl.style.width = "0%";
    usingAudio = speak();
    // A stage may hold an element that should appear on a spoken beat rather
    // than on arrival. With audio we watch currentTime, so the cue lands on the
    // words however long the take runs; without it, the same fraction of the
    // fallback hold.
    var cue = STAGES[i].cue;
    if (cue) {
      if (usingAudio) {
        (function (t) {
          var onTime = function () {
            if (cueFired || !t.duration || !isFinite(t.duration)) return;
            if (t.currentTime / t.duration >= cue) {
              fireCue(); t.removeEventListener("timeupdate", onTime);
            }
          };
          t.addEventListener("timeupdate", onTime);
        })(tracks[i]);
      } else {
        cueTimer = setTimeout(fireCue, HOLD[i] * cue);
      }
    }
    if (!reduced) raf = requestAnimationFrame(tick);
    // With audio, the 'ended' event advances the stage. The timer is only a
    // safety net for a track that never fires 'ended' (a corrupt file, say).
    var wait = usingAudio ? 120000 : HOLD[i];
    timer = setTimeout(function () { advance(); }, wait);
  }

  function go(k) { stop(false); i = k; render(); }

  function play() {
    playing = true;
    playBtn.textContent = "❚❚ Pause";
    // Only repaint if the stage on screen is not the one we are about to run.
    // On first press the intro is already displayed from page load, so
    // re-rendering it would restart its animations for no reason.
    if (painted !== i) render();
    schedule();
  }
  function stop(finished) {
    playing = false;
    clearTimeout(timer); clearTimeout(cueTimer); cancelAnimationFrame(raf);
    stopAudio(); usingAudio = false;
    playBtn.textContent = finished ? "↻ Watch again" : "▶ Play demo";
    if (finished) { progEl.style.width = "100%"; }
  }

  playBtn.addEventListener("click", function () {
    if (playing) { stop(false); return; }
    if (i === STAGES.length - 1 && progEl.style.width === "100%") { i = 0; }
    play();
  });
  nextBtn.addEventListener("click", function () {
    go(Math.min(STAGES.length - 1, i + 1));
  });
  prevBtn.addEventListener("click", function () {
    go(Math.max(0, i - 1));
  });
  soundBtn.addEventListener("click", function () {
    sound = !sound;
    soundBtn.textContent = sound ? "🔊 Sound on" : "🔇 Sound off";
    soundBtn.setAttribute("aria-pressed", sound ? "true" : "false");
    // Toggling mid-stage re-syncs: restart the stage so voice and visuals
    // begin together rather than the audio starting halfway through.
    if (!sound) { stopAudio(); usingAudio = false; }
    else if (playing) { schedule(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") nextBtn.click();
    if (e.key === "ArrowLeft") prevBtn.click();
  });

  render();
})();
</script>
</body>
</html>
